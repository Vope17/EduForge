name: eduforge

services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      HTTP_ADDR: :8080
      EDUFORGE_PUBLIC_ORIGIN: http://127.0.0.1:${EDUFORGE_PORT:-8081}
      EDUFORGE_DB: /data/eduforge.sqlite
      EDUFORGE_LLM_ENDPOINT: ${EDUFORGE_LLM_ENDPOINT:-}
      EDUFORGE_LLM_MODEL: ${EDUFORGE_LLM_MODEL:-}
      EDUFORGE_LLM_API_KEY: ${EDUFORGE_LLM_API_KEY:-}
      EDUFORGE_DAILY_GENERATIONS: ${EDUFORGE_DAILY_GENERATIONS:-30}
    volumes:
      - document-data:/data
    expose:
      - "8080"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      target: production
    ports:
      - "127.0.0.1:${EDUFORGE_PORT:-8081}:8080"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend-tools:
    profiles: [tools]
    build:
      context: ./backend
      target: development
    command: ["go", "test", "./..."]

  frontend-tools:
    profiles: [tools]
    build:
      context: ./frontend
      target: development
    command: ["npm", "test"]


volumes:
  document-data:
