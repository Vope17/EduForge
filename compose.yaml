# Fixed project name: volumes are eduforge_eduforge-{data,secrets,workspace}
# regardless of the checkout directory. Verification scripts pass their own -p.
name: eduforge

services:
  eduforge:
    build:
      context: .
      target: runtime
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.167.1}
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-2.1.290}
    ports:
      - "127.0.0.1:${EDUFORGE_PORT:-8081}:8080"
    environment:
      EDUFORGE_ORIGINS: "http://127.0.0.1:8080,http://127.0.0.1:${EDUFORGE_PORT:-8081},http://localhost:${EDUFORGE_PORT:-8081}"
      # Pages allowed to show EduForge in a frame: the iLearn portal. Empty forbids framing.
      EDUFORGE_FRAME_ANCESTORS: "${EDUFORGE_FRAME_ANCESTORS-http://127.0.0.1:8090 http://localhost:8090}"
    volumes:
      - eduforge-data:/data
      - eduforge-secrets:/secrets
      - eduforge-workspace:/workspace
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "eduforge", "healthcheck", "--url", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
      start_interval: 1s
volumes:
  eduforge-data:
  eduforge-secrets:
  eduforge-workspace:
