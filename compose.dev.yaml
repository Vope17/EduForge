services:
  backend:
    build:
      target: development
    restart: "no"
    read_only: false
    volumes:
      - development-data:/data
      - development-codex:/codex
    develop:
      watch:
        - action: sync+restart
          path: ./backend
          target: /app
          ignore:
            - Dockerfile
            - .dockerignore
            - go.mod
            - bin/
            - data/
        - action: rebuild
          path: ./backend/go.mod
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    build:
      target: development
    environment:
      VITE_API_PROXY: http://backend:8080
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    restart: "no"
    read_only: false
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src
        - action: sync
          path: ./frontend/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./frontend/vite.config.ts
          target: /app/vite.config.ts
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/Dockerfile


volumes:
  development-data:
  development-codex:
